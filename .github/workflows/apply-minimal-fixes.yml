name: Apply minimal website fixes

on:
  push:
    branches:
      - minimal-essential-fixes
    paths:
      - .github/workflows/apply-minimal-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: minimal-essential-fixes
          fetch-depth: 0

      - name: Update index.html without changing design
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # 1) Remove cookie banner CSS only. The site currently has no analytics/advertising cookie implementation.
          s = re.sub(
              r'\s*<!-- COOKIE BANNER STYLES \(FULL WIDTH FOOTER STYLE\) -->\s*<style>.*?</style>(?=\s*</head>)',
              '',
              s,
              flags=re.S
          )

          # Remove cookie banner markup + its standalone script.
          s = re.sub(
              r'\s*<!-- COOKIE BANNER STRUCTURE & LOGIC -->\s*<div id="cookie-banner".*?</div>\s*</div>\s*<script>.*?</script>(?=\s*</body>)',
              '',
              s,
              flags=re.S
          )

          # 2) Add a short privacy notice under the booking form fields.
          privacy = '''\n                <p style="font-size: 0.82rem; color: #666; line-height: 1.5; margin: -6px 0 16px 0;">\n                    Your information is used only to respond to this childcare request. Please avoid sharing unnecessary sensitive information.\n                    <a href="privacy.html" style="color: var(--dark-blue); font-weight: 700;">Read the Privacy Notice</a>.\n                </p>'''

          marker = '''                <button type="submit" class="cta-btn" style="background: var(--pure-red); width: 100%;">Send Booking Request</button>'''
          if 'Read the Privacy Notice' not in s and marker in s:
              s = s.replace(marker, privacy + '\n' + marker, 1)

          # Add privacy link to footer without changing layout.
          footer_marker = '<p>Designed by Thanh Thuy.</p>'
          footer_replacement = '<p>Designed by Thanh Thuy. · <a href="privacy.html" style="color: inherit;">Privacy Notice</a></p>'
          if footer_marker in s:
              s = s.replace(footer_marker, footer_replacement, 1)

          # 3) Keep current no-cors transport, but stop claiming server-confirmed success.
          old_alert = "alert(`Thank you, ${name}! Your booking request has been sent successfully. I will contact you via phone/WhatsApp shortly.`);"
          new_alert = "alert(`Thank you, ${name}! Your booking request has been submitted. I will contact you via phone/WhatsApp shortly. If you do not hear back, please contact me directly via WhatsApp/Zalo.`);"
          s = s.replace(old_alert, new_alert, 1)

          p.write_text(s, encoding='utf-8')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Apply minimal cookie privacy and booking fixes"
          git push origin minimal-essential-fixes

      - name: Remove old preview branch
        run: git push origin --delete essential-site-fixes || true
