name: Restore index line endings

on:
  push:
    branches:
      - minimal-essential-fixes
    paths:
      - .github/workflows/restore-line-endings.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: minimal-essential-fixes
      - name: Restore CRLF in index.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_bytes().decode('utf-8').replace('\r\n','\n').replace('\r','\n')
          p.write_bytes(s.replace('\n','\r\n').encode('utf-8'))
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Restore original index line endings"
          git push origin minimal-essential-fixes
