name: Add structured data

on:
  push:
    paths:
      - '.github/workflows/add-structured-data.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add JSON-LD to homepage
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()
          marker = '    <link rel="preconnect" href="https://fonts.googleapis.com">'
          if 'application/ld+json' in s:
              raise SystemExit('Structured data already exists')
          if marker not in s:
              raise SystemExit('Insert marker not found')

          schema = '''    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://www.thuycare.io.vn/#organization",
          "name": "Thanh Thuy Childcare",
          "alternateName": "Thanh Thuy Babysitter & Childcare",
          "url": "https://www.thuycare.io.vn/",
          "logo": "https://www.thuycare.io.vn/brand-logo.svg",
          "image": "https://www.thuycare.io.vn/tt1.jpg",
          "description": "Independent English-speaking babysitting and hourly childcare service in Ho Chi Minh City with more than 20 years of childcare experience.",
          "telephone": "+84909706148",
          "email": "thanhthuychildcare@gmail.com",
          "sameAs": [
            "https://www.facebook.com/thanh.thuy.347487"
          ],
          "areaServed": {
            "@type": "City",
            "name": "Ho Chi Minh City"
          },
          "contactPoint": {
            "@type": "ContactPoint",
            "telephone": "+84909706148",
            "contactType": "customer service",
            "availableLanguage": ["English", "Vietnamese"],
            "areaServed": "VN"
          }
        },
        {
          "@type": "Service",
          "@id": "https://www.thuycare.io.vn/#babysitting-service",
          "name": "Babysitting Service in Ho Chi Minh City",
          "serviceType": [
            "Hourly babysitting",
            "Hotel babysitting",
            "Home babysitting",
            "Apartment babysitting",
            "Evening babysitting",
            "Newborn care",
            "Infant care",
            "Toddler care"
          ],
          "provider": {
            "@id": "https://www.thuycare.io.vn/#organization"
          },
          "areaServed": {
            "@type": "City",
            "name": "Ho Chi Minh City"
          },
          "audience": {
            "@type": "Audience",
            "audienceType": "Local, expat and traveling families"
          },
          "description": "Flexible hourly childcare at homes, apartments and hotels for newborns, infants, toddlers and older children in Ho Chi Minh City."
        },
        {
          "@type": "WebSite",
          "@id": "https://www.thuycare.io.vn/#website",
          "url": "https://www.thuycare.io.vn/",
          "name": "Thanh Thuy Childcare",
          "publisher": {
            "@id": "https://www.thuycare.io.vn/#organization"
          },
          "inLanguage": "en"
        }
      ]
    }
    </script>

'''
          p.write_text(s.replace(marker, schema + marker, 1))
          PY

      - name: Commit structured data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add Organization and Service structured data"
          git push

