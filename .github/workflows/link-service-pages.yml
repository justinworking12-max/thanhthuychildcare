name: Link service pages
on:
  push:
    paths:
      - '.github/workflows/link-service-pages.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update homepage and sitemap
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()
          s = s.replace(
              "I provide hourly care for local, expat, and traveling families at their homes, apartments, and hotels. Evening care is available for dinners and events, but I do not offer overnight stays.",
              "I provide hourly care for local, expat, and traveling families at their homes, apartments, and hotels. Evening care is available for dinners, events, and other scheduled plans."
          )
          s = s.replace(
              "Evening support for dinners or events, including familiar bedtime routines. Overnight care is not available.",
              "Evening support for dinners, events, and other scheduled plans, including familiar bedtime routines."
          )
          marker = '''            </div>\n\n            <div class="pricing-section-title">Hourly Rates & Packages</div>'''
          guides = '''            </div>\n\n            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:0 0 36px 0;">\n                <a href="/hotel-babysitter-ho-chi-minh-city.html" style="text-decoration:none;border:1px solid #E2E8F0;border-radius:16px;padding:16px 18px;background:#FFF;color:var(--dark-blue);font-weight:800;">Hotel Babysitting <span style="display:block;color:#666;font-size:.82rem;font-weight:600;margin-top:4px;">For families staying at hotels or serviced apartments →</span></a>\n                <a href="/english-speaking-babysitter-ho-chi-minh-city.html" style="text-decoration:none;border:1px solid #E2E8F0;border-radius:16px;padding:16px 18px;background:#FFF;color:var(--dark-blue);font-weight:800;">English-Speaking Babysitter <span style="display:block;color:#666;font-size:.82rem;font-weight:600;margin-top:4px;">For expat, international and traveling families →</span></a>\n                <a href="/babysitting-rates-ho-chi-minh-city.html" style="text-decoration:none;border:1px solid #E2E8F0;border-radius:16px;padding:16px 18px;background:#FFF;color:var(--dark-blue);font-weight:800;">Babysitting Rates <span style="display:block;color:#666;font-size:.82rem;font-weight:600;margin-top:4px;">See pricing factors and how quotes work →</span></a>\n            </div>\n\n            <div class="pricing-section-title">Hourly Rates & Packages</div>'''
          if marker in s and '/hotel-babysitter-ho-chi-minh-city.html' not in s:
              s = s.replace(marker, guides, 1)
          p.write_text(s)

          sm = Path('sitemap.xml')
          x = sm.read_text()
          for url in [
              'https://www.thuycare.io.vn/hotel-babysitter-ho-chi-minh-city.html',
              'https://www.thuycare.io.vn/english-speaking-babysitter-ho-chi-minh-city.html',
              'https://www.thuycare.io.vn/babysitting-rates-ho-chi-minh-city.html'
          ]:
              if url not in x:
                  x = x.replace('</urlset>', f'  <url>\n    <loc>{url}</loc>\n  </url>\n</urlset>')
          sm.write_text(x)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sitemap.xml
          git diff --cached --quiet || git commit -m "Link service landing pages and update sitemap"
          git push
