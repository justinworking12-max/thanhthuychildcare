name: Generate raster favicons

on:
  push:
    paths:
      - '.github/workflows/generate-raster-favicons.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SVG renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      - name: Generate PNG favicon files
        run: |
          rsvg-convert -w 96 -h 96 favicon.svg -o favicon-96x96.png
          rsvg-convert -w 180 -h 180 favicon.svg -o apple-touch-icon.png

      - name: Update homepage favicon markup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '<link rel="icon" type="image/svg+xml" href="/favicon.svg">'
          new = '''<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
    <link rel="shortcut icon" type="image/png" href="/favicon-96x96.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg">'''
          if old not in s:
              raise SystemExit('Expected favicon markup not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit generated favicon files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add favicon-96x96.png apple-touch-icon.png index.html
          git commit -m "Add PNG favicon fallbacks for search engines"
          git push
